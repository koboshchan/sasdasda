services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - internal
    # Intentionally no `ports:` mapping and no auth configured.
    # Mongo is reachable only from other containers on the `internal`
    # network, by the Compose DNS name `mongo` - never from the host.

  server:
    # Build context is the repo root, not ./server - the root Dockerfile
    # builds the client (client-builder stage) and bundles the server into
    # a single dependency-free dist/server.cjs (server-builder stage)
    # before the runner stage that's actually shipped. No source, no
    # node_modules, no npx/tsx in the running container.
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017/mango
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      # RSA keypair must persist across image rebuilds/restarts. This is
      # the only bind mount left - the client bundle and server code are
      # now baked into the image itself, so there's nothing else to serve
      # from the host and no more manual `npm run build` step.
      - ./server/data:/app/data
    networks:
      - internal
    depends_on:
      - mongo

volumes:
  mongo-data:

networks:
  internal:
